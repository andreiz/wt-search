<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article aria-label="{{ aria }}" style="position:relative;background:{{ cardBg }};border:1px {{ borderStyle }} {{ borderColor }};border-radius:12px;padding:{{ pad }};display:flex;flex-direction:column;gap:6px;outline:{{ outline }};outline-offset:3px;font-family:var(--sans)">
  <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px">
    <h3 style="flex:1 1 240px;min-width:0;margin:0;font-size:{{ titleSize }};font-weight:650;line-height:1.3;color:var(--text);text-wrap:pretty"><span style="color:var(--accent);font-variant-numeric:tabular-nums">Ep. {{ ep }}</span><span style="color:var(--muted);font-weight:400"> · </span>{{ title }}</h3>
    <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap"><sc-if value="{{ related }}"><span style="padding:1px 7px;border-radius:999px;border:1px solid var(--border);font-weight:600">Related</span></sc-if><sc-if value="{{ multi }}"><span style="font-weight:600;color:var(--text)">{{ hitCount }} matches</span><span aria-hidden="true">·</span></sc-if>{{ date }}</span>
  </div>
  <sc-for list="{{ hits }}" as="h" hint-placeholder-count="1">
    <div style="position:relative;display:grid;grid-template-columns:{{ cols }};gap:4px 12px;padding-top:{{ h.padTop }};border-top:{{ h.rule }}">
      <sc-if value="{{ gutter }}" hint-placeholder-val="{{ true }}">
        <a href="#" aria-label="{{ h.tsAria }}" style="align-self:start;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;margin-top:1px;border-radius:6px;background:var(--tint);color:var(--accent);font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;text-decoration:none" style-hover="background:var(--skel)"><svg width="9" height="9" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z" fill="currentColor"></path></svg>{{ h.ts }}</a>
      </sc-if>
      <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
        <p aria-label="Excerpt — select to show full passage" title="Show full passage" style="margin:0;font-family:var(--serif);font-size:{{ bodySize }};line-height:1.5;color:{{ excerptColor }};display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;text-wrap:pretty;cursor:pointer;border-radius:6px;transition:background .12s ease-out" style-hover="background:color-mix(in oklch, var(--tint) 60%, transparent)"><sc-for list="{{ h.segs }}" as="s"><sc-if value="{{ s.m }}"><mark style="background:var(--mark-bg);color:var(--mark-text);border-radius:3px;padding:0 2px">{{ s.t }}</mark></sc-if><sc-if value="{{ s.u }}">{{ s.t }}</sc-if></sc-for></p>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px">
          <sc-for list="{{ h.platforms }}" as="pl" hint-placeholder-count="2">
            <a href="#" aria-label="{{ pl.aria }}" title="{{ pl.aria }}" style="display:inline-flex;align-items:center;gap:6px;height:{{ pillH }};padding:0 {{ pillPad }} 0 10px;border-radius:999px;background:{{ pl.bg }};color:{{ pl.fg }};border:1.5px solid {{ pl.bd }};font-size:{{ pillFont }};font-weight:650;text-decoration:none;white-space:nowrap;transition:border-color .12s ease-out" style-hover="border-color:var(--accent)"><svg width="10" height="10" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z" fill="currentColor"></path></svg>{{ pl.name }}<sc-if value="{{ pl.time }}"><span style="font-weight:500;opacity:.85;font-variant-numeric:tabular-nums">{{ pl.time }}</span></sc-if></a>
          </sc-for>
          <sc-if value="{{ h.ads }}">
            <button aria-label="Apple and Spotify may start a bit early because of ads" title="May start a bit early because of ads" style="display:inline-flex;align-items:center;justify-content:center;width:{{ iconBtn }};height:{{ iconBtn }};border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:help"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><circle cx="8" cy="4.9" r="1" fill="currentColor"></circle></svg></button>
          </sc-if>
          <sc-if value="{{ h.more }}"><button aria-expanded="false" style="height:{{ pillH }};padding:0 6px;border:0;background:none;color:var(--accent);font:600 14px/1 var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap">{{ h.moreText }}</button></sc-if>
          <span style="flex:1"></span>
          <button aria-label="More actions" aria-haspopup="menu" aria-expanded="{{ h.menuStr }}" style="width:{{ iconBtn }};height:{{ iconBtn }};border-radius:8px;border:1px solid {{ h.menuBd }};background:{{ h.menuBg }};color:var(--muted);font-size:18px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:var(--tint)">⋯</button>
        </div>
      </div>
      <sc-if value="{{ h.menu }}">
        <div role="menu" style="position:absolute;right:0;top:calc(100% + 6px);z-index:3;width:240px;padding:6px;border-radius:12px;background:var(--raised);border:1px solid var(--border);box-shadow:0 12px 40px rgba(30,15,5,.18);display:flex;flex-direction:column">
          <sc-for list="{{ menuItems }}" as="mi" hint-placeholder-count="4">
            <sc-if value="{{ mi.rule }}"><div style="height:1px;margin:5px 4px;background:var(--border)"></div></sc-if>
            <sc-if value="{{ mi.item }}"><button role="menuitem" style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:{{ menuRowH }};padding:4px 10px;border:0;border-radius:8px;background:transparent;color:{{ mi.color }};font:550 15px/1.2 var(--sans);text-align:left;cursor:pointer" style-hover="background:var(--tint)">{{ mi.label }}<sc-if value="{{ mi.sub }}"><span style="font-size:12px;font-weight:500;color:var(--muted)">{{ mi.sub }}</span></sc-if></button></sc-if>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-for>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:200},&quot;card&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;menuOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;focused&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = this.props.card || {
      ep: 71, title: 'Welcome to the Three-Way', date: 'Jun 10, 2010', kind: 'keyword', platforms: ['Spotify'],
      hits: [{ ts: '1:09:51', playAt: '1:09:44', more: 3, segs: ['All right, the great folks over at Highland Woodworking, they have the Earlex HV2900 ', { m: 'HVLP' }, ' ', { m: 'sprayer' }, '. When you purchase it at the sale price of $149.99, they will throw in a free copy of Jeff Jewitt\'s spray finishing made simple book and DVD.'] }]
    };
    const phone = !!this.props.phone;
    const related = c.kind === 'related';
    const order = ['YouTube', 'Apple', 'Spotify'];
    const plats = order.filter(p => (c.platforms || []).includes(p));
    const shown = phone ? plats.slice(0, 1) : plats;
    const rest = phone ? plats.slice(1) : [];
    const multi = (c.hits || []).length > 1;
    const hits = (c.hits || []).map((h, i) => {
      const at = h.playAt || h.ts;
      const menu = !!this.props.menuOpen && i === 0;
      return {
        ts: h.ts, tsAria: `Play at ${at}`,
        segs: (h.segs || []).map(s => typeof s === 'string' ? { t: s, u: true } : { t: s.m, m: true }),
        platforms: shown.map((p, j) => {
          const primary = j === 0 && !related;
          return { name: p, time: phone ? h.ts : '', aria: `Play on ${p} at ${at}`, bg: primary ? 'var(--accent)' : 'var(--raised)', fg: primary ? 'var(--on-accent)' : 'var(--text)', bd: primary ? 'var(--accent)' : 'var(--border)' };
        }),
        ads: shown.some(p => p !== 'YouTube'),
        more: !!h.more, moreText: `+${h.more} nearby`,
        padTop: i === 0 ? '2px' : '10px',
        rule: i === 0 ? '0' : '1px solid var(--border)',
        menu, menuStr: String(menu),
        menuBg: menu ? 'var(--tint)' : 'transparent',
        menuBd: menu ? 'var(--accent)' : 'transparent'
      };
    });
    const menuItems = [];
    rest.forEach(p => menuItems.push({ item: true, label: `Play on ${p}`, sub: `at ${c.hits[0].ts} · may start early (ads)`, color: 'var(--text)' }));
    if (rest.length) menuItems.push({ rule: true });
    menuItems.push({ item: true, label: 'More transcript', color: 'var(--text)' }, { item: true, label: 'Episode page', color: 'var(--text)' }, { rule: true }, { item: true, label: 'Report transcript error', color: 'var(--muted)' });
    return {
      aria: `Episode ${c.ep} ${c.title}`,
      ep: c.ep, title: c.title, date: c.date, related, multi, hitCount: (c.hits || []).length,
      cardBg: related ? 'transparent' : 'var(--surface)',
      borderStyle: related ? 'dashed' : 'solid',
      borderColor: related ? 'color-mix(in oklch, var(--border) 100%, var(--muted) 25%)' : 'var(--border)',
      outline: this.props.focused ? '3px solid var(--focus)' : 'none',
      pad: phone ? '12px 14px' : '12px 16px',
      titleSize: phone ? '15px' : '15px',
      bodySize: phone ? '16px' : '16px',
      excerptColor: related ? 'var(--muted)' : 'var(--text)',
      gutter: !phone, cols: phone ? 'minmax(0,1fr)' : '76px minmax(0,1fr)',
      pillH: phone ? '44px' : '30px', pillPad: phone ? '14px' : '12px', pillFont: phone ? '15px' : '13px',
      iconBtn: phone ? '44px' : '30px', menuRowH: phone ? '44px' : '36px',
      hits, menuItems
    };
  }
}
</script>
</body>
</html>
