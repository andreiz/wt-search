# Whole-word transcript fixes, applied in `wts chunk` (spec §3.3).
# Keys are matched case-insensitively, ignoring punctuation; multi-word keys merge into one word.
# A value is used as written, except that one in lower case keeps the capital of a sentence it
# starts ("Mortis and tenon." becomes "Mortise and tenon.").
# `keep:` lists phrases that stay as they are ("Craig Jackson", while "Craig" becomes "Kreg").
# After editing, run `wts chunk` — changed episodes are re-chunked automatically.
global:
  saw stop: SawStop
  kremona: Cremona
  kermona: Cremona
  fest tool: Festool
  # Festool Systainers (ep613 "festival sustainers", "festival tools"). "festival" alone stays:
  # it can be a real festival.
  festival sustainers: Festool Systainers
  festival sustainer: Festool Systainer
  festival tools: Festool tools
  festival tool: Festool tool
  sustainers: Systainers
  sustainer: Systainer
  work bench: workbench
  work benches: workbenches
  # T-9 Boeshield. Keys ignore punctuation, so "t9" also matches "T-9".
  bow shield: Boeshield
  bowshield: Boeshield
  boe shield: Boeshield
  t9: T-9
  # Lie-Nielsen, the hand-tool maker (ep071, ep085, ep127, ep595, ep607 "Lee Nielsen"; ep071
  # "Leon Nielsen"), and Earlex, the HVLP sprayer (ep071 "Urlex"). Found comparing walnut's
  # and wick's ep071, 2026-10-26.
  lee nielsen: Lie-Nielsen
  leon nielsen: Lie-Nielsen
  urlex: Earlex
  # "throwing shade" (ep606 58:07, the maintainer's report, 2026-10-27). "thrown shade" can be
  # right ("she's thrown shade"), so that one is an ep606 rule below.
  throne shade: throwing shade
  container store: Container Store
  borefoot: board foot
  # Titebond glue (ep044 "Tightbond", ep596 and ep604 "tight bond"). Checked on all 36
  # transcripts: no plain-English "a tight bond" yet; re-check as the archive grows.
  tight bond: Titebond
  tightbond: Titebond
  # Bessey clamps (ep044, ep598 x2). "Bessie" is also a first name: checked on all 36
  # transcripts, every match is the brand; re-check as the archive grows.
  bessie: Bessey
  # Roubo (the workbench, André Roubo): Whisper writes "Rubo" (66 times in the 36 episodes).
  rubo: Roubo
  rubo's: Roubo's
  rubos: Roubos
  ruba: Roubo          # ep595 "split top Ruba design"
  ruba's: Roubo's
  # Split-top benches: Whisper writes "split top" (17 times in the 36 episodes, all the bench).
  split top: split-top
  # Chris Schwarz (ep605 "the Swartz"; spelled right in ep595). Swartz is also a surname:
  # re-check new matches as the archive grows.
  swartz: Schwarz
  swartz's: Schwarz's
  # Lumber thickness in quarters: "eight quarter" → 8/4. Only the spellings found in the 36
  # episodes. Not 3/4 ("three quarter inch plywood") or plurals ("12 quarters"); a "four
  # quarter inch …" would also match, so check new matches for "quarter inch".
  four quarter: 4/4
  fourquarter: 4/4
  # 5/4 and 6/4: the maintainer's request; no spelling of either in the 36 episodes yet.
  five quarter: 5/4
  fivequarter: 5/4
  5 quarter: 5/4
  5quarter: 5/4
  six quarter: 6/4
  sixquarter: 6/4
  6 quarter: 6/4
  6quarter: 6/4
  eight quarter: 8/4
  eightquarter: 8/4
  8 quarter: 8/4
  8quarter: 8/4
  12 quarter: 12/4
  12quarter: 12/4
  16 quarter: 16/4
  16quarter: 16/4
  # Fractions of an inch as digits, the way people type them in a search (the maintainer,
  # 2026-10-12). Whisper writes "three-eighths" as two words, "three" and "-eighths", so the
  # keys are two words; the one-word keys are for a transcript where it does not split them.
  # 3/4, 3/8, 5/8 and 7/8 in every spelling; the others only as found in the 37 episodes.
  # Not "a quarter", "a half", "a 16th" or "a sixteenth": ordinary speech, or the "a" would
  # be lost. "three quarters of a gallon" becomes "3/4 of a gallon", which reads fine.
  three quarter: 3/4
  three quarters: 3/4
  threequarter: 3/4
  threequarters: 3/4
  3 quarter: 3/4
  3 quarters: 3/4
  one eighth: 1/8
  three eighths: 3/8
  threeeighths: 3/8
  3 8ths: 3/8
  3 8 inch: 3/8-inch        # ep609 "3-8-inch Greenwood blade"; a bare "3 8" could be anything
  five eighths: 5/8
  fiveeighths: 5/8
  5 8ths: 5/8
  5 8 bowl: 5/8 bowl        # ep597, 13:06: "a 5-8 bowl gouge"
  seven eighths: 7/8
  seveneighths: 7/8
  7 8ths: 7/8
  three sixteenth: 3/16
  three sixteenths: 3/16
  five sixteenths: 5/16
  5 16ths: 5/16
  nine 16th: 9/16
  11 16ths: 11/16
  Timbermaid: Timbermate
  Woodcrasp: Woodcraft
  # The table saw's riving knife (the maintainer's report, 2026-10-10). "writhing" alone stays.
  writhing knife: riving knife
  writhing knives: riving knives
  # "Kregger", the show's word for a Kreg pocket screw (ep613, 27:38, "Shove a Kregger in the
  # Hole"): Whisper wrote "Craigers". The name "Craig" is not touched.
  craigers: Kreggers
  # Kreg, the tool brand: Whisper writes "Craig" every time, with "Kreg" in vocab.txt. In the
  # 37 episodes of 2026-10-10 all 53 uses were the brand (ep595, 597, 608, 610, 613-615), so
  # the bare name is the key. That is the risk the skill warns about: a person called Craig in
  # another episode would be renamed too. Check every new match when episodes are added, and
  # put a real Craig's full name under `keep:` below.
  craig: Kreg
  craig's: Kreg's
  # Woodcraft, the store and sponsor (2026-10-13): Whisper writes "Wood Craft", "WoodCraft"
  # and "woodcraft". Every use in the 37 episodes is the store. "woodcraft.com" is kept as
  # said (see `keep:`).
  wood craft: Woodcraft
  woodcraft: Woodcraft
  woodcraft's: Woodcraft's
  # Mortise and tenon (2026-10-12). "mortis" alone is always the joint (ep127, 597, 608); the
  # others are longer keys because "tenant", "Morse" (ep603, a Morse taper) and "mortars" are
  # real words.
  mortis: mortise
  mortis and tenant: mortise and tenon        # ep127, 27:35
  morse and tenons: mortise and tenons        # ep300, 24:40
  mortars and tenons: mortise and tenons      # ep599, 36:24
  morrison tenon: mortise and tenon           # ep604, 38:45; ep607, 8:55
  # Marc Spagnuolo, the host: Whisper writes "Mark". A bare `mark: Marc` would also change "the
  # 30-second mark" and other people called Mark, so the keys are "Mark" beside his surname or
  # another host's name (the intro, and listeners' greetings). A value's comma is written out:
  # a replacement keeps only the punctuation after its last word.
  mark spagnuolo: Marc Spagnuolo
  mark shannon: Marc, Shannon
  mark matt: Marc, Matt
  mark and matt: Marc and Matt
  mark and shannon: Marc and Shannon
  matt and mark: Matt and Marc
  matt mark: Matt, Marc
  shannon mark: Shannon, Marc
  kanoi: Conoid        # ep071, 41:00: Nakashima's Conoid chair
  bull blank: bowl blank
  chisel mortars: chisel mortiser's
  kranoff: Krenov
  wood whisperer: Wood Whisperer
  # The guild's web address, which Whisper wrote as words (ep614, 5:10). The longer key wins
  # over the rule above.
  the wood whisperer guild com: thewoodwhispererguild.com
  lumber update: Lumber Update
  # The show's Patreon address: Whisper writes "patreon.com slash woodtalk" 40 times and these
  # a few. The longer key keeps a `wood talk` rule from making it "slash Wood Talk".
  slash wood talk: slash woodtalk
  patrion com: patreon.com
  wood talk: Wood Talk
  moxen: Moxon
  # The bench vise, which Whisper spells "vice" (2026-10-13: all 47 uses in the 37 episodes
  # are the tool). "vice versa" and "vice president" are kept below.
  vices: vises
  vice: vise
  # ep600, 48:51: clamping cauls in a bench-top glue-up. A bare `calls` would change every
  # phone call; this key matches only that sentence (2026-10-24, 37 episodes).
  series of calls: series of cauls
  shannon hits nurses: Shannon Hates Nurses
  # ep214, 47:42 and 48:28: a listener's Danish modern credenza (2026-10-24, the only two uses).
  curdenza: credenza
  plow play: plow plane   # ep44, 11:01 (2026-10-24, the only use)
  # ep616, 30:41–31:12, gluing up large panels (2026-10-24, the only uses).
  high glue: hide glue
  an abdominal: a Domino
  # The maintainer's ep601 review, 2026-10-27 (each checked on the 38 transcripts: ep601 only).
  pedula: Pedulla
  fretzall: fret saw
  woodweaver: WoodRiver
  findwoodworking: Fine Woodworking
  agamation: amalgamation
  fretzol: fret saw
# Phrases no global rule may change: matched like keys, and left exactly as transcribed.
# An episode rule still wins over a kept phrase.
keep:
  - Craig Jackson      # ep608, 25:36: a person who ran Kreg, not the brand
  - woodcraft com      # the web address ("woodcraft" ".com" to Whisper), not "Woodcraft.com"
  - vice versa         # not in the first 37 episodes; here so `vice: vise` can't touch them
  - vice president
episodes:
  2010-06-10_ep071_welcome-to-the-three-way:
    # 38:01, "I have a Lie-Nielsen dovetail saw" (the maintainer listened, 2026-10-26; walnut
    # heard "lineal dovetail saw"). This episode only: "lineal" is also a real word.
    lineals and dovetails: Lie-Nielsen dovetail saw
  2026-02-25_ep601_who-doesnt-love-a-concealed-weapon:
    # 23:31, "the 32nd inch pass on a jointer" (the maintainer's report, 2026-10-27). This
    # episode only: a "32-inch pass" can be real (a wide drum sander).
    32 inch pass: 32nd inch pass
    olsen: Olson
  2026-05-06_ep606_its-tiny-but-its-better-than-nothing:
    # 58:06, "Shannon throwing shade" (the maintainer's report, 2026-10-27).
    thrown shade: throwing shade
  2026-08-19_ep613_shove-a-kregger-in-the-hole:
    # "Craig-er" is two words to Whisper, "Craig" and "-er" (they are joined after the
    # corrections), so the key is two words. This episode only: anywhere else "Craig, er, …"
    # would be someone called Craig.
    craig er: Kregger
  2026-03-25_ep603_kids-today:
    # 0:23–0:33, a joke on too much footage being "a Matt problem". This episode only: "mats"
    # everywhere else are floor and glue mats.
    mat problem: Matt problem
    too many mats: too many Matts
    journalist contributions: generous contributions
    # 48:11–48:44, Shannon on his pole lathe. Whisper wrote the plural after "a" four times;
    # the real plurals ("questions about your pole lathes") have no "a" and are left.
    a pole lathes: a pole lathe
    spends: spins        # 48:35–48:42, what the lathe does to the work
    co pilot: Copilot
  2026-05-20_ep607_do-those-nickers-go-all-the-way-up:
    # 10:19, the guild's short address, written "TWWguild.com" at 7:06 and 7:12.
    www guild com: TWWguild.com
